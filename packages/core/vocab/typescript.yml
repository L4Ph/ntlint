# TypeScript, and the three grammars that share its syntax.
#
# This file is the only language-dependent artifact in the tool. A rule reads
# the facts this vocabulary produces and never names a language.
name: typescript
grammars: [TypeScript, Tsx, JavaScript, Jsx]
test:
  # `it`, `test`, `specify` and every modifier the frameworks chain onto them.
  # A call with no function argument, such as `it.todo("x")`, still matches here
  # and is left to the rules: it is a test that asserts nothing, not a suite.
  callee: "^(it|test|specify)(\\.(only|skip|todo|concurrent|sequential|fails|fixme|each|skipIf|runIf)(\\([^)]*\\))?)*$"
  # In-source tests: the conditional is a guard, never test logic.
  guard:
    - { kind: if_statement, condition: "import\\.meta\\.vitest" }
suite:
  callee: "^(describe|context|suite)(\\.(only|skip|each|concurrent)(\\([^)]*\\))?)*$"
structure:
  loop: [for_statement, for_in_statement, for_of_statement, while_statement, do_statement]
  conditional: [if_statement, ternary_expression, switch_statement]
  try: [try_statement]
  call: [call_expression]
assert:
  # In-source `expect` comes from `import.meta.vitest`, not from the package: a
  # vocabulary naming only the package finds no assertion in any in-source test.
  - { callee: "^expect$", importedFrom: ["vitest", "vite-plus/test", "import.meta.vitest"] }
  - { callee: "^assert$", importedFrom: ["node:assert", "node:assert/strict"] }
  - {
      callee: "^(ok|equal|notEqual|deepEqual|deepStrictEqual|throws|rejects)$",
      importedFrom: ["node:assert", "node:assert/strict"],
    }
interactionMatchers:
  [
    toHaveBeenCalled,
    toHaveBeenCalledTimes,
    toHaveBeenCalledWith,
    toHaveBeenLastCalledWith,
    toHaveBeenNthCalledWith,
    toBeCalled,
    toBeCalledTimes,
    toBeCalledWith,
  ]
snapshotMatchers: [toMatchSnapshot, toMatchInlineSnapshot, toMatchFileSnapshot]
double:
  - { callee: "^(vi|jest|sinon)\\." }
sleep:
  - { callee: "^setTimeout$" }
  - { callee: "^waitForTimeout$" }
  # A project's own sleep helper reads as the same defect.
  - { callee: "^(sleep|delay|pause)$" }
skip:
  modifiers: [skip, only, todo, fixme]
hooks:
  - { callee: "^(beforeEach|afterEach|beforeAll|afterAll)$" }
io:
  - {
      callee: "^(readFile|readFileSync|writeFile|writeFileSync|mkdir|readdir)$",
      importedFrom: ["node:fs", "node:fs/promises"],
    }
  - { callee: "^fetch$" }
nondeterminism:
  - { callee: "^Date\\.now$" }
  - { callee: "^Math\\.random$" }
  - { callee: "^randomUUID$" }
async: true
